name: Feature request
description: Suggest an improvement or a new feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: readonly
    attributes:
      label: Design principles
      options:
        - label: I've checked this keeps the playground read-only by default (no secret keys, no silent signing).
          required: true
