name: Bug report
description: Something in the playground doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **never paste secret keys** (`S…`). Security issues go through [private reporting](https://github.com/augustinemartins/Stellar-Developer-Testing-Playground/security/advisories/new), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Counter sample
        2. Choose increment_by and enter 0
        3. Press Simulate
    validations:
      required: true
  - type: input
    id: scenario
    attributes:
      label: Share link or scenario (optional)
      description: "Save & export → Create share link reproduces the exact call."
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [Testnet, Futurenet, Mainnet, Local, Custom RPC]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on macOS 16
  - type: textarea
    id: logs
    attributes:
      label: Console errors (optional)
      render: text
